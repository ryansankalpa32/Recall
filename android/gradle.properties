# Right-sized for this machine: it has ~7.6 GB of physical RAM, and the
# Flutter template default of -Xmx8G asks the Gradle daemon alone for more
# heap than the machine physically has. Together with a separate Kotlin
# compile daemon that caused the build to die with
# "Could not receive a message from the daemon".
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Cap the Kotlin compile daemon too; it is a separate JVM from the above.
kotlin.daemon.jvmargs=-Xmx1G
# Fewer concurrent workers keeps peak memory down on a low-RAM machine.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is disabled because this project lives on D:
# while the pub cache is on C:. Kotlin's RelocatableFileToPathConverter stores
# source paths relative to the project root, and Windows has no relative path
# between two drive roots, so it throws:
#   IllegalArgumentException: this and base files have different roots:
#     C:\...\pub.dev\flutter_timezone-...\FlutterTimezonePlugin.kt
#     and D:\Context aware\Recall\android
# which corrupts the incremental caches and fails compileDebugKotlin.
# Alternative fixes would be to put PUB_CACHE and the project on one drive.
kotlin.incremental=false
